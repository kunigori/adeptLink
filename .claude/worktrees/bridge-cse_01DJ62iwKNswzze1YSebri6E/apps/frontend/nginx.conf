server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js の静的ファイルキャッシュ設定
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA フォールバック（Next.js の静的エクスポートは全ページが .html で存在するので不要だが念のため）
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
